<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 카카오톡/문자 미리보기 설정 -->
  <meta property="og:title" content="[모바일 쿠폰] 누드 빼빼로 교환권이 도착했습니다." />
  <meta property="og:description" content="유효기간 내에 매장에서 교환해 주세요." />
  <title>기프티콘 확인</title>
  <style>
    body {
      font-family: 'Apple SD Gothic Neo', sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      width: 90%;
      max-width: 350px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 5px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 20px; }
    .barcode-box {
      background: #fafafa;
      border: 2px dashed #ddd;
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .barcode-box:active { transform: scale(0.98); }
    .barcode-img { width: 100%; height: 80px; background: #333; margin: 10px 0; border-radius: 4px; }
    .click-hint { font-size: 13px; color: #ff5722; font-weight: bold; }
    
    /* 낚시 결과 화면 (처음엔 숨김) */
    #surprise {
      display: none;
      margin-top: 20px;
    }
    #surprise h2 { color: #d32f2f; font-size: 24px; margin-bottom: 10px; }
    #surprise p { font-size: 16px; color: #555; }
  </style>
</head>
<body>

  <div class="card">
    <div id="coupon-area">
      <div class="title">🎁 빼빼로데이 선물 교환권</div>
      <div class="subtitle">롯데 누드 빼빼로 1개</div>
      
      <div class="barcode-box" onclick="showSurprise()">
        <p style="margin:0; font-size:12px; color:#666;">바코드를 터치하여 사용하세요</p>
        <!-- 바코드 느낌 텍스트 -->
        <div style="font-family: monospace; font-size: 28px; letter-spacing: 4px; margin: 15px 0;">
          ||||| | |||| ||| ||
        </div>
        <div class="click-hint">👉 [바코드 확대하여 보기]</div>
      </div>
    </div>

    <!-- 클릭 시 나오는 낚시 문구 -->
    <div id="surprise">
      <h2>🎉 낚였지롱! 🤣</h2>
      <p>빼빼로는 직접 사서 드세요~<br>메인 퀘스트 실패!</p>
    </div>
  </div>

  <script>
    function showSurprise() {
      document.getElementById('coupon-area').style.display = 'none';
      document.getElementById('surprise').style.display = 'block';
    }
  </script>

</body>
</html>
