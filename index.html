<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="[모바일 쿠폰] 누드 빼빼로 교환권이 도착했습니다." />
  <meta property="og:description" content="유효기간 내에 매장에서 교환해 주세요." />
  <title>기프티콘 확인</title>
  <style>
    body {
      font-family: 'Apple SD Gothic Neo', sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .card {
      background: white;
      width: 90%;
      max-width: 350px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 5px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 20px; }
    .barcode-box {
      background: #fafafa;
      border: 2px dashed #ddd;
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
    }
    .click-hint { font-size: 13px; color: #ff5722; font-weight: bold; margin-top: 10px; }

    /* 제프 더 킬러 전체 화면 팝업 */
    #scare-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: black;
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    #scare-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="card" id="coupon-card">
    <div class="title">🎁 빼빼로데이 선물 교환권</div>
    <div class="subtitle">롯데 누드 빼빼로 1개</div>
    
    <div class="barcode-box" onclick="startPrank()">
      <p style="margin:0; font-size:12px; color:#666;">바코드를 터치하여 사용하세요</p>
      <div style="font-family: monospace; font-size: 28px; letter-spacing: 4px; margin: 15px 0;">
        ||||| | |||| ||| ||
      </div>
      <div class="click-hint">👉 [쿠폰 수령 및 바코드 보기]</div>
    </div>
  </div>

  <!-- 점프스케어 (제프 더 킬러 화면) -->
  <div id="scare-screen">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Jeff_the_killer.jpg" alt="Jeff the Killer">
  </div>

  <!-- 비명 소리 오디오 -->
  <audio id="scream-sound" preload="auto">
    <source src="https://www.soundjay.com/human/screaming-man-01.mp3" type="audio/mpeg">
  </audio>

  <script>
    function startPrank() {
      // 1. "쿠폰을 받으시겠습니까?" 알림창
      const confirmReceive = confirm("쿠폰을 받으시겠습니까?");
      
      // [확인]을 눌렀을 때만 장난 실행
      if (confirmReceive) {
        // 제프 더 킬러 화면 표시
        const scare = document.getElementById('scare-screen');
        scare.style.display = 'flex';

        // 비명 소리 최대 음량 재생
        const sound = document.getElementById('scream-sound');
        sound.volume = 1.0;
        sound.play().catch(e => {
          console.log("Audio play blocked by browser:", e);
        });
      }
    }
  </script>

</body>
</html>
